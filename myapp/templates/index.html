<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приветствие Django</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 400px;
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 20px; }
        input[type="text"] {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #0072ff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        .success { color: #155724; background-color: #d4edda; padding: 10px; border-radius: 5px; margin-bottom: 15px;}
        .error { color: #721c24; background-color: #f8d7da; padding: 10px; border-radius: 5px; margin-bottom: 15px;}
    </style>
</head>
<body>
    <div class="container">
        <h1>Введите ваше имя</h1>

        <!-- Вывод ошибки, если поле пустое -->
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <!-- Вывод приветствия -->
        {% if greeting %}
            <div class="success">{{ greeting }}</div>
        {% endif %}

        <form method="POST">
            <!-- CSRF-токен для защиты (обязателен в Django) -->
            {% csrf_token %}
            <input type="text" name="username" placeholder="Ваше имя...">
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
